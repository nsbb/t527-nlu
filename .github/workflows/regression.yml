name: NLU Regression Test

on:
  push:
    branches: [main, master, develop]
    paths:
      - 'scripts/**.py'
      - 'data/**.json'
      - 'checkpoints/**.onnx'
      - '.github/workflows/regression.yml'
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # 수동 실행 가능

jobs:
  regression-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true  # 모델 파일이 LFS에 있을 수도

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # 핵심 의존성만
          pip install onnxruntime numpy transformers torch

      - name: Verify model file
        run: |
          if [ ! -f "checkpoints/nlu_v28_v46_ensemble.onnx" ]; then
            echo "❌ Model file missing"
            exit 1
          fi
          ls -lh checkpoints/nlu_v28_v46_ensemble.onnx

      - name: Run CI regression test
        id: ci_test
        run: |
          python3 scripts/ci_regression_check.py 2>&1 | tee regression_output.txt
        continue-on-error: false

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report
          path: |
            regression_output.txt
            data/ci_baseline.json

      - name: Post results to PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('regression_output.txt', 'utf8');
            const success = !output.includes('❌ 회귀');
            const emoji = success ? '✅' : '❌';
            const body = `## ${emoji} NLU Regression Test\n\n\`\`\`\n${output}\n\`\`\``;
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
